name: P1 software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup show
      - name: Install pinned host tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt
      - name: Fetch fixed PX4 EKF2 parameter source
        uses: actions/checkout@v4
        with:
          repository: PX4/PX4-Autopilot
          ref: d6f12ad1c4f70ad3230afd7d86e971421e02fef4
          path: target/px4-ekf2-source
          sparse-checkout: |
            cmake
            src/modules/ekf2
            src/lib/matrix
            src/lib/mathlib
            src/lib/geo
            src/lib/lat_lon_alt
            src/lib/atmosphere
            src/lib/world_magnetic_model
            platforms/common/include
            msg
          persist-credentials: false
      - name: Check EKF2 parameter catalog
        run: |
          .venv/bin/python tools/gen_params.py --root target/px4-ekf2-source --help-output tools/ekf2_parameter_help.json --check
          .venv/bin/python tools/gen_ekf2_covariance.py --root target/px4-ekf2-source --check
          .venv/bin/python tools/gen_ekf2_mag.py --root target/px4-ekf2-source --check
          .venv/bin/python tools/gen_ekf2_wmm.py --root target/px4-ekf2-source --check
          .venv/bin/python tools/gen_ekf2_gsf.py --root target/px4-ekf2-source --check
      - name: Build fixed PX4 host golden reference
        run: .venv/bin/python tools/golden_cpp/build.py --root target/px4-ekf2-source
      - name: Check shared IMU intake and committed golden baseline
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --example ekf2_input --target "$host" --locked
          cargo clippy --example ekf2_input --target "$host" --locked -- -D warnings
          .venv/bin/python tools/check_ekf2_host.py
      - name: Qualify Rust IMU EKF against committed PX4 baselines
        run: |
          .venv/bin/python tools/check_ekf2_imu.py
          .venv/bin/python tools/check_ekf2_host.py --case imu_noisy_clipped --output target/ekf2-host/noisy-check
          .venv/bin/python tools/check_ekf2_imu.py --baseline tests/data/ekf2/imu_noisy_clipped --output target/ekf2-host/rust-noisy
      - name: Qualify Rust barometer and magnetometer fusion
        run: |
          .venv/bin/python tools/golden_cpp/build.py --root target/px4-ekf2-source --profile baro_mag
          host="$(rustc -vV | sed -n 's/^host: //p')"
          for scenario in nominal outliers dropout_after_alignment; do
            .venv/bin/python tools/check_ekf2_baro_mag.py --case "$scenario" --rust "target/$host/release/examples/ekf2_input"
          done
      - name: Qualify Rust GNSS and range fusion
        run: |
          .venv/bin/python tools/golden_cpp/build.py --root target/px4-ekf2-source --profile gnss_range
          .venv/bin/python tools/golden_cpp/build.py --root target/px4-ekf2-source --profile gnss_range --fixture lever_arm
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo build --release --example ekf2_wmm --target "$host" --locked
          .venv/bin/python tools/check_ekf2_wmm.py --rust "target/$host/release/examples/ekf2_wmm"
          for scenario in nominal outliers dropout quality lever_arm; do
            .venv/bin/python tools/check_ekf2_gnss_range.py --case "$scenario" --rust "target/$host/release/examples/ekf2_input"
          done
      - name: Qualify full-rate EKF output and timing jitter
        run: |
          .venv/bin/python tools/golden_cpp/build.py --root target/px4-ekf2-source --profile gnss_range --output target/ekf2-host-output
          host="$(rustc -vV | sed -n 's/^host: //p')"
          for scenario in nominal jitter; do
            .venv/bin/python tools/check_ekf2_output.py --case "$scenario" --rust "target/$host/release/examples/ekf2_input"
          done
      - name: Qualify EKF resets and fault recovery
        run: |
          .venv/bin/python tools/golden_cpp/build.py --root target/px4-ekf2-source --profile gnss_range --output target/ekf2-host-resets
          .venv/bin/python tools/golden_cpp/build.py --root target/px4-ekf2-source --profile gnss_range --fixture baro_reset --output target/ekf2-host-gnss-range-baro-reset
          .venv/bin/python tools/golden_cpp/build.py --root target/px4-ekf2-source --profile gnss_range --fixture gsf_yaw --output target/ekf2-host-gnss-range-gsf-yaw
          host="$(rustc -vV | sed -n 's/^host: //p')"
          for scenario in gnss_reset baro_reset gsf_yaw vertical_clipping; do
            .venv/bin/python tools/check_ekf2_resets.py --case "$scenario" --rust "target/$host/release/examples/ekf2_input"
          done
      - name: Qualify standard estimator output
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --target "$host" --locked --lib estimator::
          cargo clippy --target "$host" --locked --example ekf2_standard -- -D warnings
          cargo build --release --target "$host" --locked --example ekf2_standard
          .venv/bin/python -m unittest discover -s tools -p 'test_check_ekf2_standard.py'
          .venv/bin/python tools/check_ekf2_standard.py --rust "target/$host/release/examples/ekf2_standard" --px4-root target/px4-ekf2-source
      - name: Check E7 runtime catalog and BMP388 compensation
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          .venv/bin/python tools/gen_ekf2_runtime_params.py --check
          cargo build --locked --target "$host" --example parameter_catalog --example bmp388_compensation
          cargo test --locked --target "$host" --example parameter_catalog
          .venv/bin/python -m unittest discover -s tools -p 'test_gen_parameter_metadata.py'
          .venv/bin/python tools/gen_parameter_metadata.py --check --rust "target/$host/debug/examples/parameter_catalog"
          .venv/bin/python tools/check_bmp388.py --rust "target/$host/debug/examples/bmp388_compensation"
          .venv/bin/python -m unittest discover -s tools -p 'test_upload_windows.py'
      - name: Qualify split estimator API against committed PX4 evidence
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          .venv/bin/python tools/check_ekf2_refactor.py --rust "target/$host/release/examples/ekf2_input"
      - name: Host tests, lint, H753 build and package checks
        run: bash tools/firmware.sh check
      - name: Separate fault-injection build (never flashed in CI)
        run: bash tools/firmware.sh build-injection
      - uses: actions/upload-artifact@v4
        with:
          name: p1-firmware-and-reports
          path: |
            target/thumbv7em-none-eabihf/release/v6x-rust-led*
            target/thumbv7em-none-eabihf/release/SHA256SUMS
            target/thumbv7em-none-eabihf/release/sections.txt
            target/thumbv7em-none-eabihf/release/disassembly.txt
            target/p1-fault-injection/thumbv7em-none-eabihf/release/v6x-rust-led*
            target/p1-fault-injection/thumbv7em-none-eabihf/release/SHA256SUMS
            target/p1-fault-injection/thumbv7em-none-eabihf/release/sections.txt
            target/ekf2-host/rust-imu/report.json
            target/ekf2-host/rust-noisy/report.json
            target/ekf2-host-baro-mag/**/report.json
            target/ekf2-host-gnss-range*/**/report.json
            target/ekf2-host-output/**/report.json
            target/ekf2-host-standard/**/report.json
            target/ekf2-refactor/**/report.json
            target/bmp388-host/report.json
            target/p1-fault-injection/thumbv7em-none-eabihf/release/disassembly.txt
