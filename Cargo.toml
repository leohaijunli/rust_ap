[package]
name = "v6x-rust-led"
version = "0.2.0"
edition = "2021"
description = "Rust/Embassy platform bring-up and timing diagnostics for the FMUv6X STM32H753"
publish = false

[dependencies]
libm = "0.2.15"
mavlink = { version = "0.17.1", default-features = false, features = ["common", "embedded", "emit-extensions"] }

[features]
default = []
fault-injection = []
fault-dump = []
estimator-mahony = []

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["set-vtor", "paint-stack"] }
critical-section = "1.2.0"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.5.0", features = ["stm32h753ii", "time-driver-tim2", "exti", "unstable-pac"] }
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["tick-hz-1_000_000"] }
embassy-usb = { version = "0.5.1", default-features = false }
embedded-can = "0.4.1"
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112", default-features = false }
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
embedded-partitions = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112", default-features = false }
embedded-io-async = { version = "=0.7.0", default-features = false }
static_cell = "2.1.1"

[target.'cfg(not(target_os = "none"))'.dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[patch.crates-io]
block-device-driver = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }

[[bin]]
name = "v6x-rust-led"
test = false
bench = false

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = 3
panic = "abort"
